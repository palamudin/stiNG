<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World v3 on WebGPU</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #e8edf2; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 12px; max-width: min(560px, calc(100vw - 24px)); background: rgba(10, 14, 20, 0.72); border-radius: 8px; padding: 10px 12px; }
  #stats { white-space: pre-wrap; font: 12px/1.45 ui-monospace, monospace; margin: 0 0 8px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row label { min-width: 96px; } .row input { flex: 1; } .row output { min-width: 44px; text-align: right; }
  p.note { margin: 6px 0 0; opacity: 0.75; font-size: 12px; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js"}}</script>
</head><body>
<div id="hud">
  <pre id="stats">starting…</pre>
  <div class="row"><label for="treeDist">Tree distance</label><input id="treeDist" type="range" min="0.5" max="2" step="0.05" value="1"><output id="oTreeDist"></output></div>
  <p class="note">WebGPU spike: ground from a compute-filled clipmap; every tree placed, culled to the view and sorted into its level on the GPU, drawn indirectly. Drag to look, WASD to move, wheel to zoom, P for the player cube (right button: first person). <code>?webgl</code> forces the WebGL 2 fallback.</p>
</div>
<script type="module" src="./world/gpu/demo.js"></script>
</body></html>
