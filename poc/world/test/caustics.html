<!doctype html>
<meta charset="utf-8">
<title>World v3.1 caustics: energy kept, every slice</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<pre id="out">running</pre>
<script type="module">
// The tiled caustics (caustics.js): over one tile of the cascade, at each of the three floor depths, on still water
// every texel reads 1, and under waves the light is moved about but not made or lost, so the mean over the tile stays 1
// in every slice (the margin catches the light that leaves the tile on one side as it comes in on the other).
import * as THREE from 'three';
import { WaveField } from '../wavegpu.js';
import { Caustics } from '../caustics.js';
const renderer = new THREE.WebGLRenderer();
const res = {};
const sun = new THREE.Vector3(0.4, 0.8, 0.3).normalize();
for (const [name, U] of [['still', 0], ['breeze', 3], ['wind', 6.8], ['gale', 12]]) {
  const wf = new WaveField(renderer, { cascades: [48, 6.9, 1.0, 0.14], fetch: 600, salt: 3 });
  wf.update(12.5, [U * 0.8, U * 0.6], 1e9);
  const ca = new Caustics(renderer, wf, { res: 256, msaa: 0 });
  ca.update(sun);
  const n = ca.res, a = new Uint16Array(n * n * 4); renderer.readRenderTargetPixels(ca.rt, 0, 0, n, n, a);
  const out = { tile: ca.L, Hs: +wf.stats.Hs.toFixed(3) };
  for (let c = 0; c < 3; c++) {
    let s = 0, m = 0, hi = 0;
    for (let i = 0; i < n * n; i++) { const v = THREE.DataUtils.fromHalfFloat(a[i * 4 + c]); s += v; m += v * v; hi = Math.max(hi, v); }
    const mean = s / (n * n); out['d' + c] = { mean: +mean.toFixed(4), contrast: +Math.sqrt(Math.max(m / (n * n) - mean * mean, 0)).toFixed(3), max: +hi.toFixed(2) };
  }
  res[name] = out;
  ca.dispose(); wf.dispose();
}
window.__result = res;
document.getElementById('out').textContent = JSON.stringify(res, null, 1);
</script>
