<!doctype html>
<meta charset="utf-8">
<title>World v3.1 shore table: the GPU bake against a brute-force distance on the CPU</title>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<pre id="out">running</pre>
<script type="module">
// The shore table's fine window (shorefield.js, baked by jump flooding on the GPU) against the exact nearest water-line
// crossing computed on the CPU from the same texel grid (the source sampled at the texels' points): the signed
// distance, the share within half a texel, the signs of distance and travel time, the direction's agreement, and the
// travel time against a 64-step straight-line integral. Jump flooding misses the nearest seed in a few cells (a known property); the share says how
// many.
import * as THREE from 'three';
import { World } from '../index.js';
import { wildSource } from '../sources/wild.js';
import { SHORE } from '../shorefield.js';
const renderer = new THREE.WebGLRenderer();
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(55, 1, 0.1, 60000);
const src = wildSource({ seed: 7 });
const world = new World(renderer, scene, camera, src, { quality: 'low', clip: { levels: 12 } });
// a shore: the demo's start finder, in short
let X0 = 0, Z0 = 0;
outer: for (let r = 0; r < 12000; r += 60) for (let a = 0; a < 6.283; a += 0.3) {
  const x = Math.cos(a) * r, z = Math.sin(a) * r, o = src.sample(x, z);
  if (o[0] > 2 && o[0] < 7 && o[2] < 0.3 && o[4] <= src.sea) { X0 = x; Z0 = z; break outer; }
}
world.build(X0, Z0);
const slot = 0, S = world.shore.slots[slot], W = SHORE.N, s = S.s, ox = S.ox, oz = S.oz;
// the GPU table, slot 0 (half floats)
const raw = new Uint16Array(W * W * 4), px = new Float32Array(W * W * 4);
renderer.setRenderTarget(world.shore.rt, slot); renderer.readRenderTargetPixels(world.shore.rt, 0, 0, W, W, raw); renderer.setRenderTarget(null);
const half = (h) => { const sg = h >> 15 ? -1 : 1, e = (h >> 10) & 31, m = h & 1023; return e === 0 ? sg * m * 2 ** -24 : e === 31 ? (m ? NaN : sg * Infinity) : sg * (1 + m / 1024) * 2 ** (e - 15); };
for (let i = 0; i < raw.length; i++) px[i] = half(raw[i]);
// the CPU: e per texel of the window (the source at the texel's point), then every crossing, then the nearest per texel
const e = new Float32Array(W * W), o = [0, 0, 0, 0, 0];
const P = (i, j) => [ox + (i + 0.5) * s, oz + (j + 0.5) * s];
for (let j = 0; j < W; j++) for (let i = 0; i < W; i++) { const [x, z] = P(i, j); src.sample(x, z, o, s); e[j * W + i] = o[0] - o[4]; }
const seeds = [];
for (let j = 0; j < W; j++) for (let i = 0; i < W; i++) {
  const e0 = e[j * W + i], [x, z] = P(i, j);
  if (i < W - 1) { const e1 = e[j * W + i + 1]; if ((e0 < 0) !== (e1 < 0)) { const f = e0 / (e0 - e1); seeds.push([x + f * s, z]); } }
  if (j < W - 1) { const e1 = e[(j + 1) * W + i]; if ((e0 < 0) !== (e1 < 0)) { const f = e0 / (e0 - e1); seeds.push([x, z + f * s]); } }
}
// a grid of the seeds for the nearest search
const cell = 8 * s, grid = new Map(); const gk = (x, z) => Math.floor(x / cell) + ',' + Math.floor(z / cell);
for (const q of seeds) { const k = gk(q[0], q[1]); if (!grid.has(k)) grid.set(k, []); grid.get(k).push(q); }
function nearest(x, z) {
  let bd = Infinity, bx = 0, bz = 0;
  const ci = Math.floor(x / cell), cj = Math.floor(z / cell);
  for (let ring = 0; ring < 80; ring++) {
    if ((ring - 1) * cell > bd) break; // every seed nearer than the best found lies within the rings searched
    for (let dj = -ring; dj <= ring; dj++) for (let di = -ring; di <= ring; di++) {
      if (Math.max(Math.abs(di), Math.abs(dj)) !== ring) continue;
      const b = grid.get((ci + di) + ',' + (cj + dj)); if (!b) continue;
      for (const q of b) { const d = Math.hypot(q[0] - x, q[1] - z); if (d < bd) { bd = d; bx = q[0]; bz = q[1]; } }
    }
  }
  return [bd, bx, bz];
}
let n = 0, within = 0, maxErr = 0, dirOk = 0, dirN = 0, tauErr = 0, tauN = 0, signOk = 0, tauSign = 0; const tauErrs = [], errs = [];
const step = 4; // every fourth texel each way (a 128 x 128 sample of the 512 x 512)
for (let j = 1; j < W - 1; j += step) for (let i = 1; i < W - 1; i += step) {
  const k = j * W + i, [x, z] = P(i, j), g = k * 4;
  if (!seeds.length) continue;
  const [bd, bx, bz] = nearest(x, z); if (bd === Infinity) continue;
  const sg = e[k] < 0 ? -1 : 1, want = sg * bd, got = px[g];
  n++; const err = Math.abs(got - want); errs.push(err); maxErr = Math.max(maxErr, err); if (err < 0.5 * s) within++;
  if (Math.sign(got) === sg) signOk++;
  if (Math.sign(px[g + 3]) === -sg) tauSign++; // the travel time: positive on the water, negative on land
  if (bd > s) { dirN++; const dx = (bx - x) / bd, dz = (bz - z) / bd; if (dx * px[g + 1] + dz * px[g + 2] > 0.9) dirOk++; }
  if (e[k] < 0 && bd > s && bd < 200) {
    let tau = 0; const M = 64;
    for (let m = 0; m < M; m++) { const t = (m + 0.5) / M; src.sample(x + (bx - x) * t, z + (bz - z) * t, o, s); const dep = Math.min(SHORE.dMax, Math.max(SHORE.dMin, o[4] - o[0])); tau += bd / M / Math.sqrt(9.81 * dep); }
    const te = Math.abs(px[g + 3] - tau) / tau; tauErrs.push(te); tauErr = Math.max(tauErr, te); tauN++;
  }
}
renderer.render(scene, camera); renderer.render(scene, camera); // (the composite is not run here: the sampler count is for the world's post, below)
const pct = (a, q) => { const b = a.slice().sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.floor(q * b.length))]; };
window.__result = { errP50: pct(errs, 0.5), errP90: pct(errs, 0.9), tauRelErrP50: pct(tauErrs, 0.5), tauRelErrP90: pct(tauErrs, 0.9), texel: s, span: W * s, texelsChecked: n, seeds: seeds.length, withinHalfTexel: within / n, maxErrM: maxErr, signAgree: signOk / n, tauSignAgree: tauSign / n, dirAgree: dirOk / Math.max(1, dirN), tauRelErrMax: tauErr, tauChecked: tauN, bakes: world.shore.stats.bakes, slots: world.shore.slots.map((S) => [S.s, S.ox, S.oz]) };
document.getElementById('out').textContent = JSON.stringify(window.__result, null, 1);
</script>
