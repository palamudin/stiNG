<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>STING key art</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&amp;family=Oswald:wght@400;600&amp;family=Ma+Shan+Zheng&amp;display=swap">
<style>
body{margin:0}
a{color:#c8902e}a:hover{color:#ede3cc}
</style>
</helmet>
<div style="width: 1600px; height: 800px; background: #0b0907; display: flex; flex-direction: column; font-family: Oswald, 'Arial Narrow', sans-serif; color: #ede3cc; overflow: hidden">
<div style="height: 64px; display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 0.6em; color: #9c8b68">AN OPEN-WORLD WASP COLONY SIMULATOR</div>
<svg width="1600" height="536" viewBox="0 0 1600 536" role="img" aria-label="Extreme close-up of a wasp's face: two huge black compound eyes staring straight out, the yellow face between them marked with a black scowl" style="display: block">
<defs>
<pattern id="facets" width="12" height="20.785" patternUnits="userSpaceOnUse">
<rect width="12" height="20.785" style="fill: #080706"></rect>
<circle cx="0" cy="0" r="5.1" style="fill: #1b1814"></circle>
<circle cx="12" cy="0" r="5.1" style="fill: #1b1814"></circle>
<circle cx="6" cy="10.39" r="5.1" style="fill: #1b1814"></circle>
<circle cx="0" cy="20.785" r="5.1" style="fill: #1b1814"></circle>
<circle cx="12" cy="20.785" r="5.1" style="fill: #1b1814"></circle>
</pattern>
<radialGradient id="face" cx="50%" cy="58%" r="60%">
<stop offset="0" style="stop-color: #f6cf2a"></stop>
<stop offset="0.55" style="stop-color: #e2ae0a"></stop>
<stop offset="1" style="stop-color: #8a5a12"></stop>
</radialGradient>
<radialGradient id="sheen" cx="38%" cy="28%" r="55%">
<stop offset="0" style="stop-color: #ffffff; stop-opacity: 0.22"></stop>
<stop offset="0.5" style="stop-color: #ffffff; stop-opacity: 0.04"></stop>
<stop offset="1" style="stop-color: #ffffff; stop-opacity: 0"></stop>
</radialGradient>
<radialGradient id="vignette" cx="50%" cy="50%" r="75%">
<stop offset="0.55" style="stop-color: #000000; stop-opacity: 0"></stop>
<stop offset="1" style="stop-color: #000000; stop-opacity: 0.75"></stop>
</radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
<feColorMatrix type="saturate" values="0"></feColorMatrix>
</filter>
<g id="eye">
<path d="M 655,70 C 575,-70 245,-90 135,40 C 25,175 45,455 165,560 C 290,660 535,620 610,480 C 650,405 615,335 565,305 C 520,278 540,210 600,180 C 645,158 672,120 655,70 Z" style="fill: url(#facets); stroke: #000000; stroke-width: 6"></path>
<path d="M 655,70 C 575,-70 245,-90 135,40 C 25,175 45,455 165,560 C 290,660 535,620 610,480 C 650,405 615,335 565,305 C 520,278 540,210 600,180 C 645,158 672,120 655,70 Z" style="fill: url(#sheen)"></path>
<path d="M 250,70 C 300,40 380,36 440,58 C 390,52 320,62 268,92 Z" style="fill: #fff8e6; opacity: 0.85"></path>
<path d="M 180,300 C 186,360 205,410 236,452" style="fill: none; stroke: #fff8e6; stroke-width: 3; opacity: 0.25; stroke-linecap: round"></path>
</g>
</defs>
<rect width="1600" height="536" style="fill: url(#face)"></rect>
<path d="M 0,0 L 1600,0 L 1600,40 C 1400,70 1120,64 960,92 C 900,104 860,120 800,124 C 740,120 700,104 640,92 C 480,64 200,70 0,40 Z" style="fill: #0e0b08"></path>
<circle cx="770" cy="34" r="9" style="fill: #3a1f12"></circle>
<circle cx="830" cy="34" r="9" style="fill: #3a1f12"></circle>
<circle cx="800" cy="16" r="9" style="fill: #3a1f12"></circle>
<circle cx="773" cy="31" r="3" style="fill: #e9d7b5; opacity: 0.6"></circle>
<circle cx="833" cy="31" r="3" style="fill: #e9d7b5; opacity: 0.6"></circle>
<path d="M 652,150 C 700,170 750,196 800,250 C 850,196 900,170 948,150 C 930,196 880,226 846,268 C 828,290 818,320 800,352 C 782,320 772,290 754,268 C 720,226 670,196 652,150 Z" style="fill: #0e0b08"></path>
<circle cx="800" cy="410" r="14" style="fill: #0e0b08"></circle>
<circle cx="752" cy="452" r="9" style="fill: #0e0b08"></circle>
<circle cx="848" cy="452" r="9" style="fill: #0e0b08"></circle>
<path d="M 706,170 C 690,110 676,60 650,-10" style="fill: none; stroke: #0e0b08; stroke-width: 26; stroke-linecap: round"></path>
<path d="M 894,170 C 910,110 924,60 950,-10" style="fill: none; stroke: #0e0b08; stroke-width: 26; stroke-linecap: round"></path>
<circle cx="706" cy="176" r="22" style="fill: #6b4210; stroke: #0e0b08; stroke-width: 6"></circle>
<circle cx="894" cy="176" r="22" style="fill: #6b4210; stroke: #0e0b08; stroke-width: 6"></circle>
<path d="M 560,536 C 600,488 690,470 790,500 L 800,536 Z" style="fill: #6b4210; stroke: #0e0b08; stroke-width: 5"></path>
<path d="M 1040,536 C 1000,488 910,470 810,500 L 800,536 Z" style="fill: #6b4210; stroke: #0e0b08; stroke-width: 5"></path>
<use href="#eye"></use>
<use href="#eye" transform="translate(1600,0) scale(-1,1)"></use>
<rect width="1600" height="536" style="fill: url(#vignette)"></rect>
<rect width="1600" height="536" filter="url(#grain)" style="opacity: {{grain}}; mix-blend-mode: multiply"></rect>
</svg>
<div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 72px; gap: 48px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-family: Rye, Georgia, serif; font-size: 116px; line-height: 1; letter-spacing: 0.1em; color: #ede3cc">STING</div>
<div style="font-size: 18px; letter-spacing: 0.5em; color: #c8902e">NATURE, AS IS.</div>
</div>
<div style="display: flex; align-items: center; gap: 28px">
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<div style="font-size: 13px; letter-spacing: 0.4em; color: #9c8b68">STUNG</div>
<div style="font-size: 30px; font-weight: 600; letter-spacing: 0.08em; color: #ede3cc">0 / 8,200,000,000</div>
</div>
<div style="width: 104px; height: 104px; background: {{seal}}; display: flex; align-items: center; justify-content: center; transform: rotate(-4deg); border-radius: 6px; box-shadow: inset 0 0 0 4px rgba(237,227,204,0.25)">
<span style="font-family: 'Ma Shan Zheng', serif; font-size: 82px; line-height: 1; color: #ede3cc">螫</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"grain":{"editor":"range","min":0,"max":0.6,"step":0.02,"default":0.28},"seal":{"editor":"color","default":"#a8231b","options":["#a8231b","#c8902e","#0e0b08"]},"$preview":{"width":1600,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return { grain: this.props.grain ?? 0.28, seal: this.props.seal ?? '#a8231b' };
}
}
</script>
</body>
</html>
